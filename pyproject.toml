[project]
name = "ipca-forecast"
version = "0.1.0"
description = "Machine learning reproduction of 'Real-time inflation forecasting with high-dimensional models: The case of Brazil' (Garcia, Medeiros & Vasconcelos, 2017)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyreadr>=0.5",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ipca_forecast"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
